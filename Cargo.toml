[package]
name = "wasm-piano"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Window",
    "AudioContext",
    "BaseAudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "OscillatorNode",
    "OscillatorType",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "GainNode",
    "HtmlCollection",
]
