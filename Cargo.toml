[package]
name = "wasm-piano"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
yew = { version = "0.21", features = ["csr"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "AudioContext",
    "BaseAudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "OscillatorNode",
    "OscillatorType",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "GainNode",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
]
