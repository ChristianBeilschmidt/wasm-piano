<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wasm Bass Piano</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="top-half">
      <canvas id="staff-canvas" width="800" height="300"></canvas>
    </div>

    <div id="bottom-half">
      <div class="piano">
        <div class="key white" data-note="C2"></div>
        <div class="key black" data-note="C#2" style="left: 5.5%"></div>
        <div class="key white" data-note="D2"></div>
        <div class="key black" data-note="D#2" style="left: 12.5%"></div>
        <div class="key white" data-note="E2"></div>
        <div class="key white" data-note="F2"></div>
        <div class="key black" data-note="F#2" style="left: 26.5%"></div>
        <div class="key white" data-note="G2"></div>
        <div class="key black" data-note="G#2" style="left: 33.5%"></div>
        <div class="key white" data-note="A2"></div>
        <div class="key black" data-note="A#2" style="left: 40.5%"></div>
        <div class="key white" data-note="B2"></div>

        <div class="key white" data-note="C3"></div>
        <div class="key black" data-note="C#3" style="left: 54.5%"></div>
        <div class="key white" data-note="D3"></div>
        <div class="key black" data-note="D#3" style="left: 61.5%"></div>
        <div class="key white" data-note="E3"></div>
        <div class="key white" data-note="F3"></div>
        <div class="key black" data-note="F#3" style="left: 75.5%"></div>
        <div class="key white" data-note="G3"></div>
        <div class="key black" data-note="G#3" style="left: 82.5%"></div>
        <div class="key white" data-note="A3"></div>
        <div class="key black" data-note="A#3" style="left: 89.5%"></div>
        <div class="key white" data-note="B3"></div>

        <div class="key white" data-note="C4"></div>
      </div>
    </div>

    <script type="module">
      import init from "./pkg/wasm_piano.js";
      init();
    </script>
  </body>
</html>
